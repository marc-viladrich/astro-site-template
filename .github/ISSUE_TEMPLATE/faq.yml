name: FAQ-Eintrag einreichen
description: Neue Frage mit Antwort für die FAQ.
title: "FAQ: "
labels: ["content:faq"]
body:
  - type: input
    id: question
    attributes: { label: Frage, placeholder: "So, wie Kund*innen sie stellen würden." }
    validations: { required: true }
  - type: textarea
    id: answer
    attributes: { label: Antwort, description: "Kurz, konkret. Markdown erlaubt." }
    validations: { required: true }
  - type: input
    id: tags
    attributes: { label: Schlagworte, description: "Kommagetrennt, steuert, auf welchen Seiten die Frage erscheint.", placeholder: "ablauf, preise" }
  - type: input
    id: order
    attributes: { label: Reihenfolge, description: "Kleinere Zahl = weiter oben. Standard 100." }
