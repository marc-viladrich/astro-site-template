    headline: Impressum
    body: |
      **Platzhalter.** Angaben gemäß § 5 DDG: Firma, Rechtsform, Anschrift, Vertretungsberechtigte, Kontakt, Registereintrag, USt-IdNr., Verantwortliche*r für den Inhalt.
